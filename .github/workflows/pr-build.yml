name: PR Build

on:
  pull_request:
    branches: [ main ]

jobs:
  build-client:
    name: Build client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install & build client
        working-directory: client
        run: |
          npm ci
          npm run build
